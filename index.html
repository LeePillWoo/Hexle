<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hexle</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 15px system-ui, sans-serif; color: #3b2c1a; }
    .panel { position: fixed; background: #f3e6c4ee; border: 2px solid #a8865a; border-radius: 10px; padding: 12px 14px; box-shadow: 0 4px 14px #0005; }
    .title { font-weight: 700; font-size: 13px; letter-spacing: .05em; color: #7a5a32; margin-bottom: 6px; }
    button { font: inherit; cursor: pointer; border: 1px solid #a8865a; border-radius: 6px; background: #e4cf9f; padding: 4px 12px; color: inherit; }
    .inv { bottom: 14px; width: min(340px, calc(50vw - 40px)); text-align: center; }
    .inv.left { left: 14px; }
    .inv.right { right: 14px; }
    .inv .add { width: 100%; margin: 2px 0 8px; font-weight: 700; }
    .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
    .tab { flex: 1; padding: 3px 0; font-size: 12px; background: #eadcb4; border-color: #c4a87a; }
    .tab i { font-style: normal; font-size: 11px; color: #8a6a42; }
    .tab.on { background: #fff6dc; border-color: #a8865a; font-weight: 700; }
    /* 5열 × 4줄 고정 높이: 카드가 늘어도 패널이 커지지 않고, 넘치면 스크롤 */
    .cards { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 72px; gap: 6px; height: calc(72px * 4 + 6px * 3); overflow-y: auto; }
    .slot { border: 1px dashed #c9b083; border-radius: 6px; background: #f7edd4; }
    .card { position: relative; width: 100%; height: 72px; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #fbf3dc; padding: 2px; }
    .card em { position: absolute; top: 2px; right: 4px; font-style: normal; font-size: 11px; font-weight: 700; color: #fff; background: #a8865a; border-radius: 8px; padding: 0 5px; }
    .card b { font-size: 24px; }
    .card small { font-size: 10px; color: #8a6a42; }
    .inv.right .card { background: #e8f2f8; }
    .card.sel { outline: 3px solid #e8a33a; background: #fff2c2; }
    #seaTiles, #deepItems { background: #cfe6efee; border-color: #5a8aa8; }
    #seaTiles .title, #deepItems .title { color: #2f5a78; }
    #seaTiles .tab, #deepItems .tab { background: #bdd8e6; border-color: #8ab0c4; }
    #seaTiles .tab.on, #deepItems .tab.on { background: #eaf6fb; }
    #seaTiles .slot, #deepItems .slot { background: #dcecf3; border-color: #9cc0d2; }
    #msg { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 700; text-shadow: 0 0 6px #fff, 0 0 2px #fff; white-space: nowrap; pointer-events: none; }
    #bar { top: 14px; left: 14px; display: flex; gap: 6px; align-items: center; padding: 8px 10px; }
    #bar .mode.on { background: #fff6dc; font-weight: 700; outline: 2px solid #e8a33a; }
    #bar .sep { width: 1px; height: 22px; background: #a8865a; margin: 0 4px; }
    #toggles { top: 14px; right: 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
