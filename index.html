<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Hexle</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 15px system-ui, sans-serif; color: #3b2c1a; overscroll-behavior: none; }
    canvas { display: block; touch-action: none; }
    .panel { position: fixed; background: #f3e6c4ee; border: 2px solid #a8865a; border-radius: 10px; padding: 12px 14px; box-shadow: 0 4px 14px #0005; }
    .title { font-weight: 700; font-size: 13px; letter-spacing: .05em; color: #7a5a32; }
    button { font: inherit; cursor: pointer; border: 1px solid #a8865a; border-radius: 6px; background: #e4cf9f; padding: 4px 12px; color: inherit; -webkit-tap-highlight-color: transparent; }
    /* 상단 바 */
    #bar { top: 10px; left: 10px; display: flex; gap: 6px; align-items: center; padding: 8px 10px; flex-wrap: wrap; max-width: calc(100vw - 20px); }
    #bar button.on { background: #fff6dc; font-weight: 700; outline: 2px solid #e8a33a; }
    #bar #erase.on { background: #ffe4e0; outline-color: #d04040; }
    #bar .sep { width: 1px; height: 22px; background: #a8865a; margin: 0 4px; }
    /* 인벤토리 */
    .inv { bottom: 14px; left: 14px; width: min(360px, calc(100vw - 60px)); text-align: center; }
    .inv .head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .inv .main { flex: 1; display: flex; gap: 4px; }
    .inv .mtab { flex: 1; font-weight: 700; padding: 4px 0; background: #eadcb4; border-color: #c4a87a; }
    .inv .mtab i { font-style: normal; font-size: 11px; color: #8a6a42; font-weight: 400; }
    .inv .mtab.on { background: #fff6dc; border-color: #a8865a; outline: 2px solid #e8a33a; }
    .inv .fold { font-size: 12px; padding: 1px 8px; }
    .inv.collapsed .add, .inv.collapsed .tabs, .inv.collapsed .cards { display: none; }
    .inv .row { display: flex; gap: 6px; margin: 2px 0 8px; }
    .inv .synth { flex: 1; font-weight: 700; }
    .inv .synth:disabled { opacity: .6; cursor: default; }
    .inv .egg { width: 44px; height: 22px; padding: 0; border: none; background: transparent; cursor: default; }   /* 테스트용 숨은 버튼 */
    /* 문제 */
    #quiz { top: 62px; left: 10px; width: 250px; padding: 10px 12px; }
    #quiz .head { display: flex; align-items: center; gap: 6px; }
    #quiz .head .title { flex: 1; }
    #quiz .fold { font-size: 12px; padding: 1px 8px; }
    #quiz.collapsed .body { display: none; }
    #quiz .modes { display: flex; gap: 6px; margin: 8px 0 4px; }
    #quiz select { flex: 1; font: inherit; font-size: 13px; padding: 3px; border: 1px solid #a8865a; border-radius: 6px; background: #fffaf0; color: inherit; }
    #quiz .q { font-size: 28px; font-weight: 800; margin: 4px 0 8px; white-space: nowrap; }
    #quiz form { display: flex; gap: 6px; }
    #quiz input { width: 0; flex: 1; font-size: 20px; padding: 4px 8px; border: 1px solid #a8865a; border-radius: 6px; background: #fffaf0; }
    #quiz .qmsg { min-height: 18px; margin-top: 6px; font-size: 13px; font-weight: 600; }
    .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
    .tab { flex: 1; padding: 3px 0; font-size: 12px; background: #eadcb4; border-color: #c4a87a; }
    .tab i { font-style: normal; font-size: 11px; color: #8a6a42; }
    .tab.on { background: #fff6dc; border-color: #a8865a; font-weight: 700; }
    /* 5열 × 4줄 고정 높이: 카드가 늘어도 패널이 커지지 않고, 넘치면 스크롤 */
    .cards { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 72px; gap: 6px; height: calc(72px * 4 + 6px * 3); overflow-y: auto; }
    .slot { border: 1px dashed #c9b083; border-radius: 6px; background: #f7edd4; }
    .card { position: relative; width: 100%; height: 72px; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #fbf3dc; padding: 2px; }
    .card em { position: absolute; top: 2px; right: 4px; font-style: normal; font-size: 11px; font-weight: 700; color: #fff; background: #a8865a; border-radius: 8px; padding: 0 5px; }
    .card b { font-size: 24px; }
    .card small { font-size: 10px; color: #8a6a42; }
    .card.item { background: #e8f2f8; }
    .card.sel { outline: 3px solid #e8a33a; background: #fff2c2; }
    #seaInv { background: #cfe6efee; border-color: #5a8aa8; }
    #seaInv .tab, #seaInv .mtab { background: #bdd8e6; border-color: #8ab0c4; }
    #seaInv .tab.on, #seaInv .mtab.on { background: #eaf6fb; }
    #seaInv .slot { background: #dcecf3; border-color: #9cc0d2; }
    /* 메시지·확인 창 */
    #msg { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 700; text-shadow: 0 0 6px #fff, 0 0 2px #fff; white-space: nowrap; pointer-events: none; }
    #modal { position: fixed; inset: 0; background: #0006; display: flex; align-items: center; justify-content: center; z-index: 10; }
    #modal[hidden] { display: none; }
    #modal .box { position: static; max-width: 320px; text-align: center; }
    #modal p { white-space: pre-line; margin: 4px 0 14px; line-height: 1.5; }
    #modal .btns { display: flex; gap: 8px; justify-content: center; }
    #modal .btns button { min-width: 90px; }
    #modal .yes { background: #e8a33a; font-weight: 700; }
    /* 좁은 화면: 바는 아이콘만, 인벤토리는 아래쪽 한 장(타일↔아이템 전환), 카드 2줄 */
    @media (max-width: 760px) {
      html, body { font-size: 13px; }
      #bar { left: 8px; right: 8px; top: 8px; padding: 6px; gap: 4px; justify-content: center; max-width: none; }
      #bar button { padding: 6px 9px; font-size: 16px; }
      #bar .label { display: none; }
      #bar .sep { margin: 0 2px; }
      .inv { left: 8px; right: 8px; bottom: 8px; width: auto; padding: 8px 10px; }
      .inv .row { margin: 0 0 6px; }
      #quiz { top: 54px; left: 8px; right: 8px; width: auto; padding: 6px 10px; }
      #quiz .modes { margin: 6px 0 2px; }
      #quiz .q { font-size: 22px; margin: 2px 0 6px; }
      #quiz input { font-size: 18px; }
      .tabs { margin-bottom: 5px; }
      .cards { grid-auto-rows: 58px; height: calc(58px * 2 + 6px); }
      .card { height: 58px; font-size: 11px; gap: 0; }
      .card b { font-size: 20px; }
      .card small { display: none; }
      #msg { bottom: auto; top: 250px; font-size: 13px; max-width: 90vw; white-space: normal; text-align: center; }
    }
  </style>
</head>
<body>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
