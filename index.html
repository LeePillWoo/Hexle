<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hexle</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 15px system-ui, sans-serif; color: #3b2c1a; }
    .panel { position: fixed; background: #f3e6c4ee; border: 2px solid #a8865a; border-radius: 10px; padding: 12px 14px; box-shadow: 0 4px 14px #0005; }
    .title { font-weight: 700; font-size: 13px; letter-spacing: .05em; color: #7a5a32; margin-bottom: 6px; }
    button { font: inherit; cursor: pointer; border: 1px solid #a8865a; border-radius: 6px; background: #e4cf9f; padding: 4px 12px; color: inherit; }
    #inv { bottom: 14px; left: 50%; transform: translateX(-50%); width: min(720px, calc(100vw - 60px)); text-align: center; }
    #gain { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
    #cards { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 72px; align-items: center; max-height: 160px; overflow-y: auto; }
    .card { width: 60px; height: 72px; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #fbf3dc; padding: 2px; }
    .card b { font-size: 24px; }
    .card small { font-size: 10px; color: #8a6a42; }
    .card.item { background: #e8f2f8; }
    .card.sel { outline: 3px solid #e8a33a; background: #fff2c2; }
    #msg { min-height: 18px; font-size: 13px; font-weight: 600; margin-top: 6px; }
    #toggles { top: 14px; right: 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="panel" id="inv">
    <div id="gain"><button id="addTile">+ 타일 추가</button><button id="addItem">+ 아이템 추가</button></div>
    <div id="cards"></div>
    <div id="msg"></div>
  </div>
  <div class="panel" id="toggles">
    <label><input type="checkbox" id="tGrid" checked /> 육각 그리드 (G)</label>
    <label><input type="checkbox" id="tEdge" checked /> 영역 경계선 (B)</label>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
